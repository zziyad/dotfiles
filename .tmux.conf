# ~/.tmux.conf — panes use zsh
set -g default-shell /home/finance/.local/bin/zsh
set -g default-command /home/finance/.local/bin/zsh
set -g mouse on
set -g history-limit 10000
set -g status-keys emacs
setw -g mode-keys emacs

set-option -g prefix C-a
unbind C-b
bind C-a send-prefix

# OSC/theme passthrough and true-colour support for Windows Terminal clients.
# This lets applications use tmux DCS passthrough for terminal colour replies.
set -g default-terminal "tmux-256color"
set -g allow-passthrough on
set -ga update-environment TERM
set -ga terminal-features ",*:RGB"
set -ga terminal-overrides ",*:Tc"

# tmux 3.5+ defaults escape-time to 10ms; over SSH (esp. Windows Terminal /
# Win32 OpenSSH) OSC 10/11 colour-query replies arrive fragmented and leak as
# visible "11;rgb:..." text. Give the client enough time to finish the sequence.
set -sg escape-time 100
